<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
.ydd-wrap{--brand:#4338CA;--brand-dark:#312E81;--brand-soft:#EEF2FF;--ink:#1E1B4B;font-family:'Vazirmatn',sans-serif;}
.ydd-grid{display:flex;flex-wrap:wrap;gap:16px;}
.ydd-card{flex:1 1 260px;border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:180px;}
.ydd-lockup{display:flex;flex-direction:row-reverse;align-items:center;gap:14px;}
.ydd-text{display:flex;flex-direction:column;align-items:flex-end;}
.ydd-fa{font-weight:900;font-size:28px;line-height:1;}
.ydd-en{font-weight:400;font-size:12px;letter-spacing:2px;margin-top:4px;}
.ydd-caption{font-size:12px;color:var(--text-secondary);font-family:var(--font-sans);text-align:center;}
</style>
<h2 class="sr-only">مفهوم طراحی لوگو و واترمارک برای برند یاددای، شامل نسخه کامل، نسخه روشن روی پس‌زمینه تیره، آیکون تنها و نسخه واترمارک</h2>
<div class="ydd-wrap">
  <div class="ydd-grid">

    <div class="ydd-card" style="background:#FFFFFF;border:1px solid #E5E7EB;">
      <div class="ydd-lockup" dir="rtl">
        <svg width="56" height="56" viewBox="0 0 120 120">
          <rect x="4" y="4" width="112" height="112" rx="28" fill="#4338CA"/>
          <path d="M42 34 L42 84 L60 70 L78 84 L78 34 Z" fill="#FFFFFF"/>
          <circle cx="82" cy="38" r="7" fill="#FBBF24"/>
        </svg>
        <div class="ydd-text">
          <div class="ydd-fa" style="color:#1E1B4B;">یاددای</div>
          <div class="ydd-en" style="color:#6366F1;">Y A D D A D I</div>
        </div>
      </div>
      <div class="ydd-caption">نسخه اصلی — پس‌زمینه روشن</div>
    </div>

    <div class="ydd-card" style="background:#1E1B4B;">
      <div class="ydd-lockup" dir="rtl">
        <svg width="56" height="56" viewBox="0 0 120 120">
          <rect x="4" y="4" width="112" height="112" rx="28" fill="#FFFFFF"/>
          <path d="M42 34 L42 84 L60 70 L78 84 L78 34 Z" fill="#312E81"/>
          <circle cx="82" cy="38" r="7" fill="#FBBF24"/>
        </svg>
        <div class="ydd-text">
          <div class="ydd-fa" style="color:#FFFFFF;">یاددای</div>
          <div class="ydd-en" style="color:#A5B4FC;">Y A D D A D I</div>
        </div>
      </div>
      <div class="ydd-caption" style="color:#C7D2FE;">نسخه معکوس — پس‌زمینه تیره</div>
    </div>

    <div class="ydd-card" style="background:#EEF2FF;">
      <svg width="88" height="88" viewBox="0 0 120 120">
        <rect x="4" y="4" width="112" height="112" rx="28" fill="#4338CA"/>
        <path d="M42 34 L42 84 L60 70 L78 84 L78 34 Z" fill="#FFFFFF"/>
        <circle cx="82" cy="38" r="7" fill="#FBBF24"/>
      </svg>
      <div class="ydd-caption">آیکون تنها — مناسب فاوآیکون و اپ</div>
    </div>

    <div class="ydd-card" style="background:#DDD6FE;position:relative;overflow:hidden;">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg, rgba(255,255,255,0.25) 0 10px, transparent 10px 20px);"></div>
      <div class="ydd-lockup" dir="rtl" style="opacity:0.18;position:relative;z-index:1;">
        <svg width="44" height="44" viewBox="0 0 120 120">
          <rect x="4" y="4" width="112" height="112" rx="28" fill="#1E1B4B"/>
          <path d="M42 34 L42 84 L60 70 L78 84 L78 34 Z" fill="#FFFFFF"/>
        </svg>
        <div class="ydd-text">
          <div class="ydd-fa" style="color:#1E1B4B;font-size:22px;">یاددای</div>
        </div>
      </div>
      <div class="ydd-caption" style="position:relative;z-index:1;">نسخه واترمارک — کم‌رنگ برای روی عکس و سند</div>
    </div>

  </div>
</div>
